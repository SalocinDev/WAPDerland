<!DOCTYPE html>
<html>
    <head>
        <title>WAPDerland</title>
    </head>
    <body>
        <h1>Server</h1>
        <p>Minecraft Version: 1.20.1</p>
        <a href="https://adoptium.net/temurin/releases?version=17&os=any&arch=any"><p>Java Version (JDK/JRE): 17</p></a>
        <p>Server Modloader: Forge</p>
        <a href="https://files.minecraftforge.net/net/minecraftforge/forge/index_1.20.1.html"><p>Forge Version: 1.20.1 - 47.4.10</p></a>
        <a href="https://github.com/SalocinDev/WAPDerland/releases/"><p>Modpack Link</p></a>
        <p>Download the Latest Version</p>
        <button id="checkServerButton">Check Server Status</button>
        <div id="serverResults"></div>
    </body>
    <script>
        var checkResult = document.getElementById("serverResults")

        document.getElementById("checkServerButton").addEventListener("click", checkServerFunction);

        async function checkServerFunction(){
            checkResult.textContent = "Loading..."
            var data = await fetch("https://api.mcstatus.io/v2/status/java/ramp-letters.tun.ply.gg");
            var result;
            try {
                result = await data.json();
            } catch (err){
                result = {success: false, error: err};
                checkResult.textContent = "Error Checking Server, Cannot Connect to checker Service"
            }
            appendElements(plotData(result));
            checkResult.textContent = "Check Successful";
        }

        function plotData(data) {
            var onlineStatus = document.createElement("p");
            var minecraftVersion = document.createElement("p");
            var playersOnline = document.createElement("p");
            var playersList = document.createElement("p");
            var serverMOTD = document.createElement("p");
            var serverIconText = document.createElement("p");
            var serverIcon = new Image;
            
            onlineStatus.textContent = `Online: ${data.online}`; 
            minecraftVersion.textContent = `Minecraft Version: ${data.version?.name_clean ?? "Unknown"}`; 
            playersOnline.textContent = `Players Online: ${data.players?.online ?? 0}/${data.players?.max ?? 0}`; 
            playersList.textContent = `Players: ${ data.players?.list?.map(player => player.name_clean).join(", ") || "None" }`; 
            serverMOTD.textContent = `MOTD: ${data.motd?.clean ?? "None"}`;
            serverIconText.textContent = `Server Icon: `
            serverIcon.src = data.icon;

            return { 
                onlineStatus, 
                minecraftVersion, 
                playersOnline, 
                playersList, 
                serverMOTD,
                serverIcon
            };
        }

        function appendElements(elements) {
            checkResult.append(
            elements.onlineStatus,
            elements.minecraftVersion,
            elements.playersOnline,
            elements.playersList,
            elements.serverMOTD,
            elements.serverIconText,
            elements.serverIcon
            )
        }
    </script>
</html>
